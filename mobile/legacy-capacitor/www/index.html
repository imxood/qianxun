<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark light" />
    <title>千寻</title>
    <style>
      :root {
        --bg: #f6f6f8;
        --card: #ffffff;
        --fg: #1c1c1e;
        --muted: #7a7a80;
        --accent: #3b82f6;
        --border: #e3e3e8;
        --ok: #22c55e;
        --bad: #ef4444;
        --danger: #ef4444;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17171a;
          --card: #1f1f23;
          --fg: #ececf1;
          --muted: #8a8a92;
          --border: #2c2c31;
          --ok: #4ade80;
          --bad: #f87171;
          --danger: #f87171;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        /* 安全区：viewport-fit=cover 下的系统栏避让 */
        padding: calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 32px);
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 100%;
        box-sizing: border-box;
        max-width: 560px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        margin: 0;
      }
      p.hint {
        color: var(--muted);
        font-size: 13px;
        margin: 0;
        line-height: 1.6;
      }
      p.hint.small {
        font-size: 12px;
        opacity: 0.85;
      }
      /* 连接卡片列表 */
      #list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .conn {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .conn:active {
        opacity: 0.75;
      }
      .dot {
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot[data-state='on'] {
        background: var(--ok);
        box-shadow: 0 0 6px var(--ok);
      }
      .dot[data-state='off'] {
        background: var(--bad);
      }
      .meta {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .meta .name {
        font-size: 16px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta .host,
      .meta .used {
        font-size: 12px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .more {
        flex: none;
        width: 40px;
        height: 40px;
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 22px;
        padding: 0;
        border-radius: 10px;
      }
      input {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--fg);
        font-size: 15px;
        padding: 12px 14px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
      }
      input:focus {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        border: none;
        border-radius: 10px;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 13px 0;
        width: 100%;
      }
      #error {
        color: var(--danger);
        font-size: 13px;
        min-height: 1em;
        margin: 0;
      }
      #ok {
        color: var(--ok);
        font-size: 13px;
        min-height: 1em;
        margin: 0;
      }
      /* 底部操作单 */
      #mask {
        position: fixed;
        inset: 0;
        background: rgb(15 23 42 / 45%);
        z-index: 40;
      }
      #sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 41;
        background: var(--card);
        border-radius: 18px 18px 0 0;
        padding: 10px 16px calc(env(safe-area-inset-bottom) + 16px);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #sheet .title {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        padding: 8px 0 10px;
      }
      #sheet button {
        background: transparent;
        border: none;
        color: var(--fg);
        font-size: 16px;
        padding: 14px 8px;
        border-radius: 10px;
        text-align: center;
      }
      #sheet button.danger {
        color: var(--danger);
      }
      #sheet button + button {
        border-top: 1px solid var(--border);
        border-radius: 0;
      }
      #sheet .cancel {
        margin-top: 8px;
        background: var(--bg);
      }
      /* 扫码 / 粘贴 */
      .row {
        display: flex;
        gap: 10px;
      }
      .row button {
        flex: 1;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--fg);
        font-size: 14px;
        padding: 12px 0;
      }
      /* 扫码取景层 */
      #scanner {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: #000;
      }
      #scanner video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #scanner .frame {
        position: absolute;
        left: 50%;
        top: 42%;
        width: 240px;
        height: 240px;
        transform: translate(-50%, -50%);
        border: 2px solid rgb(255 255 255 / 85%);
        border-radius: 20px;
        /* 取景框外整体压暗：大扩散阴影 */
        box-shadow: 0 0 0 200vmax rgb(0 0 0 / 35%);
        pointer-events: none;
      }
      #scanner .hint {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(42% + 140px);
        text-align: center;
        color: #fff;
        font-size: 14px;
        text-shadow: 0 1px 4px rgb(0 0 0 / 60%);
      }
      #scanner .close {
        position: absolute;
        top: calc(env(safe-area-inset-top) + 14px);
        right: 14px;
        background: rgb(15 23 42 / 60%);
        color: #fff;
        border: none;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>千寻</h1>
      <p class="hint">
        选择一台电脑进入工作台。电脑端「设置 → 远程访问」会展示配对二维码（形如
        <code>http://10.x.x.x:17400/qx-gate?token=…</code>
        ）：**扫码**或粘贴链接添加，每台电脑存一条，随时切换。
      </p>
      <ul id="list"></ul>
      <p id="empty" class="hint">还没有保存的连接。</p>
      <section class="add" style="display: flex; flex-direction: column; gap: 10px">
        <input id="url" type="url" placeholder="http://<EasyTier-IP>:17400/qx-gate?token=…" />
        <input id="name" type="text" maxlength="30" placeholder="备注名称（留空自动读取电脑名）" />
        <button id="add" class="primary">添加连接</button>
        <div class="row">
          <button id="scan">📷 扫码添加</button>
          <button id="paste">📋 粘贴链接</button>
        </div>
        <p id="ok"></p>
        <p id="error"></p>
      </section>
      <p class="hint small">
        ⚠️ 配对令牌等同该电脑的控制权：仅保存在本机，请勿分享链接或把连接保存到不信任的设备上。
      </p>
    </main>

    <div id="mask" hidden></div>
    <div id="sheet" hidden>
      <p class="title" id="sheetTitle"></p>
      <button id="actConnect">立即连接</button>
      <button id="actRename">重命名</button>
      <button id="actUpdate">更新配对链接</button>
      <button id="actDelete" class="danger">删除连接</button>
      <button id="actCancel" class="cancel">取消</button>
    </div>

    <div id="scanner" hidden>
      <video id="scanVideo" playsinline muted autoplay></video>
      <canvas id="scanCanvas" hidden></canvas>
      <div class="frame"></div>
      <p class="hint" id="scanHint">对准电脑端「远程访问」页面上的配对二维码</p>
      <button class="close" id="scanClose" aria-label="关闭扫码">✕</button>
    </div>

    <script src="vendor/jsQR.js"></script>
    <script>
      const STORE_KEY = 'qx.connections.v1';
      const LEGACY_KEY = 'qx.gatewayUrl';
      const PROBE_TIMEOUT_MS = 3000;

      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      const urlInput = document.getElementById('url');
      const nameInput = document.getElementById('name');
      const addBtn = document.getElementById('add');
      const errorEl = document.getElementById('error');
      const okEl = document.getElementById('ok');
      const mask = document.getElementById('mask');
      const sheet = document.getElementById('sheet');
      const sheetTitle = document.getElementById('sheetTitle');

      let connections = load();
      let sheetTargetId = null;

      function load() {
        try {
          const raw = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
          if (Array.isArray(raw)) return raw.filter((item) => item && item.id && item.url);
        } catch {
          /* 损坏数据当作空 */
        }
        return [];
      }

      function save() {
        localStorage.setItem(STORE_KEY, JSON.stringify(connections));
      }

      // 旧版单地址迁移：一次性并进连接列表。
      function migrateLegacy() {
        const legacy = localStorage.getItem(LEGACY_KEY);
        if (!legacy) return;
        localStorage.removeItem(LEGACY_KEY);
        if (connections.some((item) => item.url === legacy)) return;
        if (!isValidPairUrl(legacy)) return;
        connections.push({
          id: newId(),
          name: '我的电脑',
          url: legacy,
          addedAt: Date.now(),
          lastUsedAt: 0,
        });
        save();
      }

      function newId() {
        return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function isValidPairUrl(text) {
        return /^http:\/\/[a-z0-9.-]+:\d+\/qx-gate\?token=[0-9a-f]{8,}$/i.test(text.trim());
      }

      function escapeHtml(text) {
        return String(text).replace(
          /[&<>"']/g,
          (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch],
        );
      }

      function sorted() {
        return [...connections].sort(
          (a, b) =>
            (b.lastUsedAt || 0) - (a.lastUsedAt || 0) || (b.addedAt || 0) - (a.addedAt || 0),
        );
      }

      function relTime(ts) {
        if (!ts) return '从未使用';
        const diff = Date.now() - ts;
        const minute = 60_000;
        if (diff < minute) return '刚刚使用';
        if (diff < 60 * minute) return Math.floor(diff / minute) + ' 分钟前使用';
        if (diff < 24 * 60 * minute) return Math.floor(diff / (60 * minute)) + ' 小时前使用';
        return Math.floor(diff / (24 * 60 * minute)) + ' 天前使用';
      }

      function hostOf(conn) {
        try {
          return new URL(conn.url).host;
        } catch {
          return conn.url;
        }
      }

      function render() {
        const items = sorted();
        list.innerHTML = items
          .map(
            (item) => `
            <li class="conn" data-id="${escapeHtml(item.id)}">
              <span class="dot" data-state="unknown"></span>
              <div class="meta">
                <strong class="name">${escapeHtml(item.name)}</strong>
                <span class="host">${escapeHtml(hostOf(item))}</span>
                <span class="used">${escapeHtml(relTime(item.lastUsedAt))}</span>
              </div>
              <button class="more" aria-label="更多操作">⋯</button>
            </li>`,
          )
          .join('');
        empty.hidden = items.length > 0;
      }

      // ---- 在线探测：优先走 Capacitor 原生 HTTP（无混合内容/跨域限制），浏览器回退 fetch ----

      function capacitorHttp() {
        return window.Capacitor && window.Capacitor.Plugins
          ? window.Capacitor.Plugins.CapacitorHttp
          : null;
      }

      function infoUrl(conn) {
        try {
          const parsed = new URL(conn.url);
          const token = parsed.searchParams.get('token') || '';
          return parsed.origin + '/qx-mobile/info?token=' + encodeURIComponent(token);
        } catch {
          return null;
        }
      }

      async function probeInfo(conn) {
        const url = infoUrl(conn);
        if (!url) return null;
        const native = capacitorHttp();
        if (native) {
          try {
            const response = await native.get({
              url,
              connectTimeout: PROBE_TIMEOUT_MS,
              readTimeout: PROBE_TIMEOUT_MS,
            });
            if (response.status !== 200) return null;
            const data = response.data;
            return typeof data === 'string' ? JSON.parse(data) : data;
          } catch {
            return null;
          }
        }
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), PROBE_TIMEOUT_MS);
          const response = await fetch(url, { signal: controller.signal });
          clearTimeout(timer);
          return response.ok ? await response.json() : null;
        } catch {
          return null;
        }
      }

      function setDot(connId, state) {
        const dot = list.querySelector(`.conn[data-id="${connId}"] .dot`);
        if (dot) dot.dataset.state = state;
      }

      function refreshStatuses() {
        if (document.hidden) return;
        sorted().forEach((conn, index) => {
          setTimeout(async () => {
            const info = await probeInfo(conn);
            setDot(conn.id, info ? 'on' : 'off');
          }, index * 150);
        });
      }

      // ---- 添加连接（输入框来源：手输 / 扫码 / 粘贴共用一条校验链） ----

      async function addFromInput() {
        const url = urlInput.value.trim();
        errorEl.textContent = '';
        okEl.textContent = '';
        if (!isValidPairUrl(url)) {
          errorEl.textContent =
            '链接形态不对：请扫电脑端「远程访问」的配对二维码，或完整粘贴配对链接。';
          return;
        }
        if (connections.some((item) => item.url === url)) {
          errorEl.textContent = '这条连接已经存在。';
          return;
        }
        const manualName = nameInput.value.trim();
        addBtn.disabled = true;
        addBtn.textContent = '正在识别电脑…';
        const draft = {
          id: newId(),
          name: manualName || hostOf({ url }),
          url,
          addedAt: Date.now(),
          lastUsedAt: 0,
        };
        const info = await probeInfo(draft);
        addBtn.disabled = false;
        addBtn.textContent = '添加连接';
        if (info && info.hostname && !manualName) draft.name = info.hostname;
        connections.push(draft);
        save();
        render();
        refreshStatuses();
        urlInput.value = '';
        nameInput.value = '';
        if (info) {
          okEl.textContent = `已添加「${draft.name}」${info.dshReady ? '，DSH 运行中' : '（DSH 未运行，稍后可连）'}`;
        } else {
          errorEl.textContent = '暂时连不上这台电脑（可能离线），已按地址保存，连上后状态点亮。';
        }
      }

      addBtn.addEventListener('click', () => {
        addFromInput();
      });

      // ---- 粘贴添加：读剪贴板回填并校验（WebView 受限时回退手动粘贴） ----

      document.getElementById('paste').addEventListener('click', async () => {
        try {
          const text = (await navigator.clipboard.readText()) || '';
          if (!text.trim()) {
            errorEl.textContent = '剪贴板是空的。';
            return;
          }
          urlInput.value = text.trim();
          addFromInput();
        } catch {
          errorEl.textContent = '无法读取剪贴板：请长按上方输入框选择「粘贴」。';
        }
      });

      // ---- 扫码添加：getUserMedia + jsQR，识别到配对码自动回填添加 ----

      const scanner = document.getElementById('scanner');
      const scanVideo = document.getElementById('scanVideo');
      const scanCanvas = document.getElementById('scanCanvas');
      const scanHint = document.getElementById('scanHint');
      const SCAN_HINT_DEFAULT = '对准电脑端「远程访问」页面上的配对二维码';
      let scanStream = null;
      let scanTimer = 0;
      let hintResetTimer = 0;

      function flashScanHint(text) {
        scanHint.textContent = text;
        clearTimeout(hintResetTimer);
        hintResetTimer = setTimeout(() => {
          scanHint.textContent = SCAN_HINT_DEFAULT;
        }, 1600);
      }

      async function openScanner() {
        if (typeof window.jsQR !== 'function') {
          errorEl.textContent = '扫码组件未就绪，请重启应用或改用粘贴。';
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          errorEl.textContent = '当前环境不支持相机，请改用粘贴。';
          return;
        }
        try {
          scanStream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1280 },
              height: { ideal: 720 },
            },
          });
        } catch {
          errorEl.textContent = '相机不可用（权限被拒或被占用）：可在系统设置允许相机后重试。';
          return;
        }
        errorEl.textContent = '';
        okEl.textContent = '';
        scanner.hidden = false;
        scanVideo.srcObject = scanStream;
        try {
          await scanVideo.play();
        } catch {
          /* 首帧未就绪时 play() 可能拒绝，下一轮 tick 自动恢复 */
        }
        scanTimer = setInterval(scanTick, 200);
      }

      function closeScanner() {
        clearInterval(scanTimer);
        scanTimer = 0;
        clearTimeout(hintResetTimer);
        if (scanStream) {
          scanStream.getTracks().forEach((track) => track.stop());
          scanStream = null;
        }
        scanVideo.srcObject = null;
        scanner.hidden = true;
      }

      function scanTick() {
        if (scanVideo.readyState < 2 || scanVideo.videoWidth === 0) return;
        const scale = Math.min(1, 480 / scanVideo.videoWidth);
        scanCanvas.width = Math.round(scanVideo.videoWidth * scale);
        scanCanvas.height = Math.round(scanVideo.videoHeight * scale);
        const context = scanCanvas.getContext('2d');
        context.drawImage(scanVideo, 0, 0, scanCanvas.width, scanCanvas.height);
        const image = context.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
        const code = window.jsQR(image.data, image.width, image.height, {
          inversionAttempts: 'dontInvert',
        });
        if (!code || !code.data) return;
        const url = code.data.trim();
        if (!isValidPairUrl(url)) {
          flashScanHint('不是千寻配对码，请对准「远程访问」页面的二维码');
          return;
        }
        navigator.vibrate?.(60);
        closeScanner();
        urlInput.value = url;
        addFromInput();
      }

      document.getElementById('scan').addEventListener('click', () => {
        openScanner();
      });
      document.getElementById('scanClose').addEventListener('click', closeScanner);
      window.addEventListener('pagehide', closeScanner);

      // ---- 连接 / 操作单 ----

      function connect(conn) {
        conn.lastUsedAt = Date.now();
        save();
        location.href = conn.url;
      }

      function openSheet(conn) {
        sheetTargetId = conn.id;
        sheetTitle.textContent = conn.name;
        mask.hidden = false;
        sheet.hidden = false;
      }

      function closeSheet() {
        sheetTargetId = null;
        mask.hidden = true;
        sheet.hidden = true;
      }

      list.addEventListener('click', (event) => {
        const card = event.target.closest('.conn');
        if (!card) return;
        const conn = connections.find((item) => item.id === card.dataset.id);
        if (!conn) return;
        if (event.target.closest('.more')) openSheet(conn);
        else connect(conn);
      });

      document.getElementById('actConnect').addEventListener('click', () => {
        const conn = connections.find((item) => item.id === sheetTargetId);
        closeSheet();
        if (conn) connect(conn);
      });
      document.getElementById('actRename').addEventListener('click', () => {
        const conn = connections.find((item) => item.id === sheetTargetId);
        closeSheet();
        if (!conn) return;
        const name = (prompt('连接名称', conn.name) || '').trim();
        if (name) {
          conn.name = name;
          save();
          render();
        }
      });
      document.getElementById('actUpdate').addEventListener('click', () => {
        const conn = connections.find((item) => item.id === sheetTargetId);
        closeSheet();
        if (!conn) return;
        const url = (prompt('粘贴新的配对链接', conn.url) || '').trim();
        if (!url) return;
        if (!isValidPairUrl(url)) {
          alert('链接形态不对：应来自千寻设置页的配对二维码/复制链接。');
          return;
        }
        conn.url = url;
        save();
        render();
        refreshStatuses();
      });
      document.getElementById('actDelete').addEventListener('click', () => {
        const conn = connections.find((item) => item.id === sheetTargetId);
        closeSheet();
        if (!conn) return;
        if (confirm(`删除「${conn.name}」？只移除本机保存的连接，不影响电脑端。`)) {
          connections = connections.filter((item) => item.id !== conn.id);
          save();
          render();
        }
      });
      document.getElementById('actCancel').addEventListener('click', closeSheet);
      mask.addEventListener('click', closeSheet);

      // ---- 启动：迁移旧地址 → 渲染 → 探测在线状态（可见时每 20s 刷新） ----

      migrateLegacy();
      render();
      refreshStatuses();
      setInterval(refreshStatuses, 20_000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) refreshStatuses();
      });
      window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
          render();
          refreshStatuses();
        }
      });
    </script>
  </body>
</html>
