<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千寻移动端 · 页面设计 v2</title>
<style>
/* ============================================================================
   设计系统令牌 —— 逐值抄自 lib/app/theme/qx_semantic.dart（暗色）
   改了这里就要改 Dart，两边必须一致。check_contrast.py 是唯一闸门。
   ========================================================================= */
:root{
  /* 五态语义色 */
  --running:#3DDC97;  --waiting:#FFC24B;  --done:#7CC4FF;
  --detached:#737C87; --failed:#FF7B72;
  /* 中性阶 */
  --canvas:#0B0E13; --surface:#12161D; --raised:#1A2029; --sunken:#070A0E;
  --hairline:rgba(255,255,255,.12);
  --t1:#E8EDF2; --t2:#9AA7B4; --t3:#72818F;
  --accent:#12B5A8; --on-accent:#04211F; --rail-idle:#2A323C;

  /* 排版：手机正文 15px / 次要 13px / 元信息 11px */
  --f1:15px; --f2:13px; --f3:11px; --fm:20px;
  --lh:20px;

  /* 间距刻度 4/8/12/16/20/24 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;

  --r-s:6px; --r-m:10px; --r-l:14px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{
  background:#05070A;
  color:var(--t1);
  font:400 var(--f1)/var(--lh) -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding:28px 20px 80px;
}
h1{font-size:var(--fm);font-weight:650;letter-spacing:-.2px;margin-bottom:6px}
.sub{color:var(--t2);font-size:var(--f2);margin-bottom:26px;max-width:1100px;line-height:1.55}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:26px}
nav a{
  color:var(--t2);text-decoration:none;font-size:var(--f2);
  padding:6px 12px;border:1px solid var(--hairline);border-radius:var(--r-s);
  transition:.12s;
}
nav a:hover{border-color:var(--accent);color:var(--t1)}
nav a.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.stage{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:14px}
.cap{color:var(--t3);font-size:var(--f3);letter-spacing:.3px;text-transform:uppercase}

/* 手机框 390×844 —— iPhone 14 逻辑宽 */
.phone{
  width:390px;height:844px;background:var(--canvas);
  border:1px solid var(--hairline);border-radius:22px;overflow:hidden;
  position:relative;display:flex;flex-direction:column;flex:0 0 auto;
}
.note{
  max-width:300px;color:var(--t2);font-size:var(--f2);line-height:1.6;
  border-left:2px solid var(--accent);padding-left:12px;
}
.note b{color:var(--t1);display:block;margin-bottom:4px;font-size:var(--f2)}
.note .why{color:var(--t3);font-size:var(--f3);margin-top:6px;display:block}

/* ── 状态栏 ── */
.sb{height:44px;flex:0 0 auto;display:flex;align-items:center;
    justify-content:space-between;padding:0 var(--s4) 0 var(--s5);
    font-size:var(--f3);color:var(--t2);font-variant-numeric:tabular-nums}

/* ── 顶栏 ── */
.top{
  flex:0 0 auto;padding:0 var(--s4) var(--s3);
  display:flex;align-items:center;gap:var(--s3);
}
.top h2{font-size:22px;font-weight:660;letter-spacing:-.3px}
.mach{
  margin-left:auto;display:flex;align-items:center;gap:6px;
  font-size:var(--f3);color:var(--t2);
  background:var(--raised);border:1px solid var(--hairline);
  padding:5px 10px;border-radius:var(--r-s);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--running);flex:0 0 auto}

/* ══ 看护带：恒定高度，永不塌陷 ══ */
.band{
  flex:0 0 auto;height:184px;background:var(--surface);
  border-bottom:1px solid var(--hairline);
  padding:var(--s3) var(--s4);
  display:flex;flex-direction:column;gap:var(--s2);
  position:relative;
}
/* 左侧粗轨出血到屏幕边 —— 信号轨的看护带形态 */
.band::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--waiting)}
.band-h{display:flex;align-items:center;gap:var(--s2);font-size:var(--f3);color:var(--t3)}
.band-h .ttl{color:var(--t2);font-weight:600;letter-spacing:.4px}
.band-h .cnt{margin-left:auto;background:var(--raised);border:1px solid var(--hairline);
  padding:2px 7px;border-radius:99px;font-size:var(--f3);color:var(--t2)}
.task{
  display:flex;align-items:center;gap:var(--s3);
  background:var(--raised);border:1px solid var(--hairline);
  border-radius:var(--r-m);padding:10px var(--s3);min-height:52px;
}
.task .kind{
  flex:0 0 auto;font-size:var(--f3);color:var(--on-accent);background:var(--waiting);
  padding:3px 7px;border-radius:var(--r-s);font-weight:650;letter-spacing:.2px;
}
.task .body{flex:1;min-width:0}
.task .t1l{font-size:var(--f2);line-height:18px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.task .t2l{font-size:var(--f3);color:var(--t3);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .go{flex:0 0 auto;color:var(--accent);font-size:var(--f2);font-weight:600}
/* 空态：留白，不塌陷 —— 关键 */
.band-empty{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;color:var(--t3);font-size:var(--f2)}
.band-empty .sm{font-size:var(--f3);color:var(--rail-idle)}

/* ── 列表 ── */
.list{flex:1;overflow:hidden;position:relative}
.row{
  display:flex;align-items:stretch;gap:var(--s3);
  padding:11px var(--s4) 11px var(--s3);
  border-bottom:1px solid rgba(255,255,255,.055);
  min-height:66px;position:relative;
}
.row:hover{background:rgba(255,255,255,.022)}
/* 轨出血到屏幕左缘，不是内缩装饰条 */
.rail{flex:0 0 auto;width:4px;border-radius:0 2px 2px 0;align-self:stretch}
.r-run{background:var(--running);animation:pulse 1.8s ease-in-out infinite}
.r-wait{background:repeating-linear-gradient(180deg,var(--waiting) 0 6px,transparent 6px 11px)}
.r-done{background:var(--done)}
.r-weak{background:var(--detached)}
.r-stale{background:repeating-linear-gradient(180deg,var(--detached) 0 3px,transparent 3px 7px);opacity:.55}
.r-fail{background:var(--failed)}
.r-detach{background:repeating-linear-gradient(180deg,var(--detached) 0 5px,transparent 5px 10px)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

.col-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rt{display:flex;align-items:baseline;gap:var(--s2)}
.title{font-size:var(--f1);line-height:20px;font-weight:560;flex:1;min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  letter-spacing:-.1px}
.age{flex:0 0 auto;font-size:var(--f3);color:var(--t3);font-variant-numeric:tabular-nums}
/* 第二行 = agent 最近做的事。这是签名级决定 */
.act{font-size:var(--f2);line-height:18px;color:var(--t2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 状态词：绝不靠颜色单独表意，每个态都有可见中文 */
.meta{display:flex;align-items:center;gap:5px;font-size:var(--f3);color:var(--t3);
  white-space:nowrap;overflow:hidden}
.st{font-weight:650;letter-spacing:.2px;flex:0 0 auto}
.st-run{color:var(--running)} .st-wait{color:var(--waiting)}
.st-done{color:var(--done)} .st-weak{color:var(--detached)}
.st-stale{color:var(--detached)} .st-detach{color:var(--detached)}
.meta .sep{color:var(--rail-idle)}
.meta .num{font-variant-numeric:tabular-nums}
/* 元信息有 6 段，390dp 宽屏上必然要取舍。
   优先级：状态词 > 轮次 > 上下文 > 子任务 > 步数 > 目录。
   用 flex-shrink 让低优先级的先被压掉，而不是把 ctx 挤出可视区
   —— ctx 被挤掉恰好是最糟的结局：用户看不到最该警觉的那个数。 */
.meta > *{flex:0 1 auto;min-width:0}
.meta .grow{flex:1 1 0;min-width:0}
.meta .drop{overflow:hidden;text-overflow:ellipsis}
.meta .ctx{overflow:hidden;text-overflow:ellipsis}
/* 目录单独一行：实测最长 32 字，挤进元信息行必然把上下文挤掉。
   而上下文恰恰是这一行最该被看见的数。 */
.meta2{font-size:var(--f3);color:var(--rail-idle);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ctx{margin-left:auto;flex:0 0 auto;font-variant-numeric:tabular-nums}
.ctx-hi{color:var(--waiting);font-weight:650}
.bar{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--waiting);opacity:.85}

.chip{
  display:inline-flex;align-items:center;gap:3px;font-size:var(--f3);
  color:var(--t3);background:rgba(255,255,255,.045);
  border:1px solid var(--hairline);padding:1px 6px;border-radius:var(--r-s);
}

/* ── 输入栏 ── */
.comp{
  flex:0 0 auto;background:var(--surface);border-top:1px solid var(--hairline);
  padding:var(--s3) var(--s4) calc(var(--s3) + 8px);
}
.ctxmeter{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2);
  font-size:var(--f3);color:var(--t2)}
.ctxmeter .track{flex:1;height:3px;background:var(--rail-idle);border-radius:2px;overflow:hidden}
.ctxmeter .fill{height:100%;background:var(--waiting);border-radius:2px}
.cbox{
  display:flex;align-items:flex-end;gap:var(--s2);
  background:var(--sunken);border:1px solid var(--hairline);
  border-radius:var(--r-l);padding:9px 9px 9px var(--s3);
}
.cbox .ph{flex:1;color:var(--t3);font-size:var(--f1);line-height:20px}
.icon{width:30px;height:30px;flex:0 0 auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--t2);font-size:15px}
.send{width:32px;height:32px;flex:0 0 auto;border-radius:50%;background:var(--accent);
  color:var(--on-accent);display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700}
/* 模式切换：手机没有 Alt+Enter，必须拇指可达 */
.modes{display:flex;gap:0;background:var(--sunken);border:1px solid var(--hairline);
  border-radius:var(--r-m);padding:2px;margin-bottom:var(--s2)}
.modes .m{flex:1;text-align:center;font-size:var(--f3);padding:6px 0;
  border-radius:8px;color:var(--t3);transition:.14s}
.modes .m.on{background:var(--raised);color:var(--t1);font-weight:600}
.modes .m.on.steer{color:var(--waiting)}

/* ── 接管层 / sheet ── */
.scrim{position:absolute;inset:0;background:rgba(3,5,8,.78);
  display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--surface);border-top:1px solid var(--hairline);
  border-radius:18px 18px 0 0;padding:var(--s4) var(--s4) var(--s5);
  max-height:86%;overflow:hidden}
.grab{width:36px;height:4px;background:var(--rail-idle);border-radius:2px;
  margin:0 auto var(--s4)}
.sheet h3{font-size:17px;font-weight:650;margin-bottom:var(--s2)}
.sheet .meta-line{font-size:var(--f3);color:var(--t3);margin-bottom:var(--s3)}
.cmd{
  background:var(--sunken);border:1px solid var(--hairline);border-radius:var(--r-m);
  padding:var(--s3);margin-bottom:var(--s3);
  font:400 12px/18px ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color:var(--t1);white-space:pre;overflow-x:auto;
}
.q{border:1px solid var(--hairline);border-radius:var(--r-m);
  padding:var(--s3);margin-bottom:var(--s2);background:var(--raised)}
.q .qt{font-size:var(--f1);font-weight:560;margin-bottom:10px}
.opt{
  display:flex;align-items:center;gap:10px;padding:9px 11px;
  border:1px solid var(--hairline);border-radius:var(--r-s);
  margin-bottom:6px;font-size:var(--f2);color:var(--t2);
}
.opt:last-child{margin-bottom:0}
.opt .rd{width:15px;height:15px;border-radius:50%;border:2px solid var(--rail-idle);flex:0 0 auto}
.opt.on{border-color:var(--accent);color:var(--t1);background:rgba(18,181,168,.09)}
.opt.on .rd{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 4px,transparent 4px)}
.btns{display:flex;gap:var(--s2);margin-top:var(--s4)}
.btn{flex:1;text-align:center;padding:12px 0;border-radius:var(--r-m);font-size:var(--f1);font-weight:600}
.btn-p{background:var(--accent);color:var(--on-accent)}
.btn-p.off{background:var(--rail-idle);color:var(--t3)}
.btn-s{border:1px solid var(--hairline);color:var(--t2)}

/* ── 断链横幅 ── */
.banner{
  flex:0 0 auto;background:rgba(115,124,135,.13);
  border-bottom:1px solid var(--hairline);
  padding:9px var(--s4);font-size:var(--f3);color:var(--t2);
  display:flex;align-items:center;gap:var(--s2);
}
.banner .rt{margin-left:auto;color:var(--accent);font-weight:600}

/* ── 空态 / 错误 ── */
.center{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:var(--s6);text-align:center;gap:var(--s2)}
.center .big{font-size:var(--f1);font-weight:600;color:var(--t1)}
.center .sm{font-size:var(--f2);color:var(--t2);line-height:1.6}
.center .hint{font-size:var(--f3);color:var(--t3);margin-top:var(--s2);line-height:1.65}

/* 灰度自检 */
.gs{filter:grayscale(1) contrast(.95)}
.legend{color:var(--t3);font-size:var(--f3);margin-top:10px;line-height:1.7;max-width:390px}
.legend b{color:var(--t2)}
</style>
</head>
<body>

<h1>千寻移动端 · 页面设计</h1>
<p class="sub">
  全部数据来自真机 <code style="color:var(--accent)">session/list</code> 实测（393 条会话，样本 14 条），
  颜色与排版逐值抄自 <code style="color:var(--accent)">qx_semantic.dart</code>。
  状态共 6 态：运行中 / 等你 / 已完成 / 已收工 / 3 分钟前 / 已断开 —— 每一态都配可见中文，
  不靠颜色单独表意。用顶部标签切页，或用 URL hash 直达（如 <code>#chat</code>）。

<nav id="nav"></nav>

<script>
/* ══════════════════════════════════════════════════════════════════════
   真实数据（probe_session_sample.py 从 192.168.20.2 拉取，落盘在
   docs/probe/session-list-sample.json）。这里内联一份是刻意的：
   原型要能离线双击打开，不依赖 fetch。改数据请重跑探针再同步。

const REAL = {

/* 真实分布：标题最长 40 字（服务端截断），37% 超 20 字，4 条标题完全重复 */

const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 状态元表：轨宽 / 轨形 / 状态词 / 状态色 —— 四重编码，颜色只是其中一条 */
const STATES = {
  running:{cls:'r-run', st:'st-run', word:'运行中', w:4, rail:'实心 + 流光'},
  waiting:{cls:'r-wait',st:'st-wait', word:'等你',   w:3, rail:'虚线 6/5'},
  done:   {cls:'r-done', st:'st-done', word:'已完成', w:1, rail:'实心细线'},
  weak:   {cls:'r-weak', st:'st-weak', word:'已收工', w:1, rail:'实心细线'},
  stale:  {cls:'r-stale',st:'st-stale',word:'3 分钟前',w:1,rail:'密虚线 + 降级'},
  detach: {cls:'r-detach',st:'st-detach',word:'已断开',w:2,rail:'虚线 5/5'}
};

function row(item, state, opts={}){
  const S = STATES[state];
  const ctx = item.ctx;
  // 上下文只在 >50% 显示 —— 实测 p90 才 53%，常驻等于给 87% 的会话腾地方
  const ctxHtml = (ctx != null && ctx > 50)
    ? `<span class="ctx ${ctx>65?'ctx-hi':''}">上下文 ${ctx}%</span>` : '';
  return `<div class="row">
    <div class="rail ${S.cls}" title="轨 ${S.w}dp · ${S.rail}"></div>
    <div class="col-main">
      <div class="rt">
        <div class="title">${esc(opts.title||item.t)}</div>
        <div class="age">${esc(opts.age||item.age)}</div>
      </div>
      <div class="act">${esc(opts.act||item.act)}</div>
      <div class="meta">
        <span class="st ${S.st}">${S.word}</span>
        <span class="sep">·</span>
        <span class="num">${item.turns} 轮</span>
        <span class="sep">·</span>
        ${ctxHtml}
        <span class="sep">·</span>
        <span class="num drop">${item.steps} 步</span>
        ${item.team?`<span class="sep">·</span><span class="chip drop">子 ${item.team}</span>`:''}
      </div>
      <div class="meta2" title="${esc(item.cwd)}">
        <span class="dir">${esc(item.cwd)}</span>

  const hash = location.hash.slice(1);

  document.getElementById('nav').innerHTML = SCREENS.map(s=>
    `<a href="#${s.id}" class="${s.id===cur.id?'on':''}">${s.name}</a>`).join('');
  document.getElementById('stage').innerHTML = `
    <div class="col">
      <div class="cap">${cur.name}</div>
      ${cur.fn()}
      <div class="legend">
        <b>为什么这么设计：</b>${cur.why}

      </div>
    </div>`;
  window.scrollTo(0,0);
}
