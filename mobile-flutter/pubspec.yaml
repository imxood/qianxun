name: qianxun_mobile
description: 千寻 DSH 远程客户端 —— 原生 Flutter 实现的 AI Agent 工作台。
publish_to: "none"
# 版本号规则（2026-11-05 定）：
#   `X.Y.Z+N` —— Z 是功能版本，N 是**构建序号**（决定 Android versionCode）。
#
# ⚠️ **N 必须远大于任何历史值**，不能从 1 重新数。
#
# 踩过的坑（2026-11-05）：手机上装的是 0.3.0，新包 0.3.1 装不上，Android 报
# 「已安装更高版本"千寻(0.3.0)"」——因为 **versionCode 降级被拦**
# （INSTALL_FAILED_VERSION_DOWNGRADE），不是签名问题。
#
# versionCode 的真实算法（Flutter gradle 插件，FlutterPlugin.kt）：
#   split-per-abi 时：versionCode = ABI偏移×1000 + buildNumber
#     armv7=+1000 / arm64=+2000 / x86_64=+4000
#   不 split 时：      versionCode = buildNumber
#   （base 来自 flutter.versionCode，由工具按 buildNumber 写入 local.properties）
#
# 历史的 0.3.0 是 buildNumber=1 -> arm64 versionCode=2001，而当时手机上那个
# 包的 versionCode 更高（历史构建序号曾更大），于是 0.3.1（arm64=2002）
# 仍被当作「降级」拦下。
#
# 现在把 buildNumber 提到 **30000**：arm64 包 versionCode=32000，
# 远高于任何历史值，不会再撞降级拦截。以后递增只需把 N 往上加。
version: 0.3.1+30000

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理：整棵树的单一数据源，provider 粒度化避免全局 rebuild。
  flutter_riverpod: ^2.5.1

  # 路由：声明式路由 + 深链，session 详情可被系统分享。
  go_router: ^14.2.7

  # 网关 / DSH 传输层。
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # 连接持久化（qx.connections.v1，与 RN 客户端同 schema）。
  shared_preferences: ^2.3.2

  # 渲染 Agent 消息里的 markdown / 代码块。
  flutter_markdown: ^0.7.3

  # 日志导出：把排查用的 txt 走系统分享（微信/邮件/文件传输…）。
  share_plus: ^10.1.2

  # 应用私有目录，用于落盘日志与临时导出文件。
  path_provider: ^2.1.5
  webview_flutter: ^4.14.1
  # Android 专有扩展：`AndroidWebViewController.setOnShowFileSelector` 是
  # 「页面里的 <input type=file> 弹系统选择器」的唯一入口，不接就静默失败。
  # 必须显式声明为依赖——否则类型提升失效（`is AndroidWebViewController`
  # 之后仍按基类解析，编译报「方法未定义」）。
  #
  # ⚠️ 版本约束用 ^4.12.0（不是 ^4.14.1）：本机 Flutter SDK 3.47.9 的
  # `flutter pub get` 要求它降到 4.12.0，钉 4.14.1 会解析失败。
  # `setOnShowFileSelector` 在 4.12.0 就有，API 形状相同。
  webview_flutter_android: ^4.12.0
  cookie_jar: ^4.0.9

  # WebView 里的 <input type="file"> 走原生文件选择器。
  # DSH 的「+ -> 文件」是页面里的原生 file input（fileInputRef.click()），
  # WebView 必须接 onShowFileChooser 才会弹框——不接就是静默失败
  # （插件默认返回空列表）。选中的文件回传给页面时需要 URI 列表。
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    # 自带 JetBrains Mono 子集：工具输出与代码块用，不依赖运行时网络。
    - family: QxMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
