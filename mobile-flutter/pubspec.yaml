name: qianxun_mobile
description: 千寻 DSH 远程客户端 —— 原生 Flutter 实现的 AI Agent 工作台。
publish_to: "none"
version: 0.3.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理：整棵树的单一数据源，provider 粒度化避免全局 rebuild。
  flutter_riverpod: ^2.5.1

  # 路由：声明式路由 + 深链，session 详情可被系统分享。
  go_router: ^14.2.7

  # 网关 / DSH 传输层。
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # 连接持久化（qx.connections.v1，与 RN 客户端同 schema）。
  shared_preferences: ^2.3.2

  # 渲染 Agent 消息里的 markdown / 代码块。
  flutter_markdown: ^0.7.3

  # 日志导出：把排查用的 txt 走系统分享（微信/邮件/文件传输…）。
  share_plus: ^10.1.2

  # 应用私有目录，用于落盘日志与临时导出文件。
  path_provider: ^2.1.5
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    # 自带 JetBrains Mono 子集：工具输出与代码块用，不依赖运行时网络。
    - family: QxMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
