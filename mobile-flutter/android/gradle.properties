org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 关掉 Kotlin 增量编译。
#
# Kotlin 2.x 的增量缓存（`caches-jvm/**/*.tab`）在本机会把构建搞挂，报错长这样：
#   java.lang.Exception: Could not close incremental caches in
#   build/<plugin>/kotlin/compileDebugKotlin/cacheable/caches-jvm/...
#   IllegalArgumentException: this and base files have different roots:
#     C:\Users\...\Pub\Cache\... 和 E:\develop\...
#
# 真实原因是缓存表用 `Path.relativeTo()` 算键，而 pub 缓存（C:）与项目（E:）
# 不同盘符。报错信息里完全看不出「跨盘」这四个字，非常容易被误判成代码问题。
# 就算把 PUB_CACHE 挪到 E: 绕开跨盘，已经损坏的缓存表仍会让构建继续失败。
#
# 增量编译对这个体量的项目本来就不是瓶颈（全量编译约 3-5 分钟），
# 关掉它换来构建稳定是明确的交易。需要增量时删掉这一行并 `flutter clean`。
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
