[package]
name = "qianxun"
version = "0.9.2"
edition = "2021"
description = "千寻 —— 个人开发者的工作台：管理 DSH、承载工具、连接远程"

[workspace]
# resolver 2：按目标平台分别统一 feature。缺它时，target 专属依赖（如
# Windows 专属的 tauri-runtime-wry → tauri/gtk3）会把 feature 泄漏到 Linux
# 构建，害得 CEF 路线同时拉进 GTK3 + GTK4 两套绑定。
resolver = "2"
# 移植/收编 crate 与主包同仓同构建；src-tauri 即 workspace 根。
# laya-*：Laya System-1 决策模型的 Rust/ONNX 推理引擎、探针与 localhost sidecar（见 docs/09）。
members = [
    "crates/proc-guard",
    "crates/node-runtime",
    "crates/fff-core",
    "crates/fff-grep",
    "crates/fff-query-parser",
    "crates/laya-engine",
    "crates/laya-cli",
    "crates/laya-server",
    "crates/qx-server",
]

[lib]
name = "qianxun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "qianxun"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
# Tauri 3：runtime 不再由 tauri 的 cargo feature 选择，改为直接依赖 runtime
# crate 并在 lib.rs 用 Builder::runtime 选定。两条路线按目标平台分家：
#   · Windows → tauri-runtime-wry（系统 WebView2，见下方 windows 专属段）
#   · Linux   → tauri-runtime-cef（内嵌 Chromium，见下方 linux 专属段）
# 两者不可同时启用：tauri 只绑定一套 GTK（gtk4 优先），wry 会拉 GTK3 +
# WebKitGTK，CEF 走 GTK4，混装会在运行期打架（见 docs/25）。
# devtools 移到 runtime crate 上开（会联动启用 tauri 的同名 feature）：
# release 构建也启用开发者工具（右键「检查」/ F12），方便现场排查前端问题。
tauri = { version = "3.0.0-alpha.6", features = ["tray-icon", "image-png", "protocol-asset"] }
# 文件对话框插件：默认 features 里的 gtk3 只对 Linux/BSD 生效，但 GTK3 与
# GTK4 官方不允许同进程共存（CEF 路线走 GTK4），所以全局改用 xdg-portal
# 后端（XDG Desktop Portal），彻底不引入 gtk-sys。Windows/macOS 的 rfd
# 后端与 feature 无关，仍走系统原生对话框。
tauri-plugin-dialog = { version = "3.0.0-alpha.4", default-features = false, features = [
    "xdg-portal",
] }
# 打开文件 / 资源管理器定位（搜索结果操作，M2）。
tauri-plugin-opener = "3.0.0-alpha.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 情报出刊读 DSH 的 cordis.patch.yml / .credentials.yaml（docs/17 §7.4）。
serde_yaml = "0.9"
thiserror = "2"
# 日志时间戳。只要 clock（本地时间），其余特性关闭以控制依赖面。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 托管域：supervisor/安装器需要异步进程、管道、定时与网络探测；
# 只开用到的 feature，不引入默认的 fs/信号面。
tokio = { version = "1", default-features = false, features = [
    "process",
    "io-util",
    "net",
    "time",
    "sync",
    "macros",
    "rt",
] }
# 就绪行解析出的 URL 需要严格校验（回环/端口），不信任子进程输出。
url = "2"
# 工作区/家目录定位（node-runtime 也依赖它）。
dirs = "6"
# Node 发行版校验（SHASUMS256.txt）与 zip 解包；只开 deflate。
sha2 = "0.10"
zip = { version = "6", default-features = false, features = ["deflate"] }
# 搜索双页（M2，架构 §4.9）：文件名搜索与内容搜索 SDK，均为 MIT。
# fff 定制版已收编进仓库（crates/fff-*），不再依赖外部路径/仓库。
fff-search = { path = "crates/fff-core" }
fff-grep = { path = "crates/fff-grep" }
fff-query-parser = { path = "crates/fff-query-parser", default-features = false }
# 移植 crate：进程树回收 + Node 探测。
proc-guard = { path = "crates/proc-guard" }
node-runtime = { path = "crates/node-runtime" }
tauri-plugin-clipboard-manager = "3.0.0-alpha.3"
tauri-plugin-global-shortcut = "3.0.0-alpha.3"
# 托盘「开机自启」勾选项：封装注册表 Run 键（HKCU，当前用户）的
# 读写与回读；只在 Rust 侧用（托盘），无需前端 capability。
tauri-plugin-autostart = "3.0.0-alpha.3"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# 远程网关（R1，架构 §4.5）：DSH 回环唯一暴露面——axum 终结 HTTP/WS，
# reqwest 流式转发 /api（含 SSE），tokio-tungstenite 桥两条 WS 下行。
# native-tls：插件市场（market）是第一个走 HTTPS 的调用方；SChannel 走
# 系统 trust store，企业代理的自签根证书也能过（rustls 会拒）。
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = [
    "stream",
    "json",
    "native-tls",
] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
# 服务端隧道（docs/19）：千寻作为纯客户端接入 qx-server——transport::connect +
# tunnel::serve_stream/HostAssert 复用 crate 全套载体与协议。
qx-server = { path = "crates/qx-server" }
yamux = "0.6"
tokio-util = { version = "0.7", features = ["compat"] }
# RouterHandle：网关每次重建发布最新 Router，隧道端每流取当前版本。
arc-swap = "1"
# 网卡枚举（绑定地址选择 + EasyTier 识别）。
if-addrs = "0.13"
# grep 结果的 glob 过滤（M2 深化）：glob→正则。fff 自用版本不外露。
regex = "1"
# 插件市场兼容判定：包声明的 @deepseek-ai/dsh 范围 vs 千寻钉住的 DSH 版本。
semver = "1"
# 设备配对 token。
rand = "0.8"
# /qx-mobile/info 的电脑主机名（App 端自动命名连接用）。
hostname = "0.4"
# 磁盘清理（磁盘清理页）：删除走回收站，可撤销。
trash = "5"
# 结构化日志：fff-core 内 `log::*` 默认 no-op；汇总 §7.2 + 04 报告 §3.1
# 指出应用从未 init logger 导致 16 处 log 调用全丢。env_logger 是最轻量
# 方案（不开 log4rs/tracing 避免再增依赖面）；由 lib.rs setup `try_init`
# 兜底失败不阻断启动，`RUST_LOG` 默认 `info`。
env_logger = "0.11"
# log facade（env_logger 的运行时；fff-core 也通过 log::* 上报）。
log = "0.4"

[target.'cfg(windows)'.dependencies]
# 盘符枚举（搜索根选择器，M2 深化）：与 proc-guard 同一条 windows-sys 主线，
# 只多开 Storage_FileSystem 一个 feature 门。单实例（single_instance 模块）
# 用 Threading 门：互斥体/事件/等待。
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }
# 窗口域：WebView2 COM 偏好（浏览器加速键开关、首选配色跟随 OS 应用模式）。
# 版本必须与 wry 一致：with_webview 回调递出的 COM 对象实现的是 wry 那份
# webview2-com/windows-core 的 Interface，两份版本并存时 `cast` 找不到方法
# （E0599 实测踩坑：autostart 插件把 wry 升到 webview2-com 0.39 这一代）。
webview2-com = "0.39"
windows-core = "0.62"
# 截屏依赖 xcap：Windows 走 GDI/DXGI 抓屏；Linux 路线不编译 xcap
# （它在 Linux 需要 pipewire/xcb/drm/wayland 一整套系统库，且截图功能
# 在非 Windows 上按设计返回明确错误，见 src-tauri/src/shots/commands.rs）。
xcap = "0.9.8"
# Windows 路线 runtime：系统 WebView2（Chromium 内核由 Edge 提供）。
# devtools feature 挂在 runtime crate 上（联动启用 tauri 的 devtools）。
tauri-runtime-wry = { version = "3.0.0-alpha.6", features = ["devtools"] }

# Linux 路线 runtime：tauri-runtime-cef 内嵌 Chromium（CEF 154.x）。
# 走 GTK4 + XWayland，不依赖系统 WebKitGTK；CEF 运行库由 cef-dll-sys
# 在构建期铺到二进制旁（Linux 无 RPATH，需 LD_LIBRARY_PATH 或
# -Wl,-rpath,$ORIGIN，见 docs/25）。
[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-cef = { version = "3.0.0-alpha.7", features = ["devtools"] }

# fff-search 增量编译：该 crate 的 LLVM 后端体量极端（收编的 frizbee SIMD
# 匹配矩阵单包 ≈ 全仓一半编译时间，且按调用树整簇塞进单个 CGU 串行编译），
# release 默认不增量导致改动一行也要全量重编 ~9 分钟。打开后仅重编脏 CGU。
# 全量构建成本 +10~20%（MIR 编码），换来日常迭代热重建数量级加速。
[profile.release.package.fff-search]
incremental = true
