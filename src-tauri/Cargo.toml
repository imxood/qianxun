[package]
name = "qianxun"
version = "0.3.0"
edition = "2021"
description = "千寻 —— 个人开发者的工作台：管理 DSH、承载工具、连接远程"

[workspace]
# 五个移植/收编 crate 与主包同仓同构建；src-tauri 即 workspace 根。
members = [
    "crates/proc-guard",
    "crates/node-runtime",
    "crates/fff-core",
    "crates/fff-grep",
    "crates/fff-query-parser",
]

[lib]
name = "qianxun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "qianxun"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools：release 构建也启用 WebView2 开发者工具（右键菜单「检查」/ F12），
# 方便现场排查前端问题；调试构建本就默认开启。
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "devtools"] }
# 打开文件 / 资源管理器定位（搜索结果操作，M2）。
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# 日志时间戳。只要 clock（本地时间），其余特性关闭以控制依赖面。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 托管域：supervisor/安装器需要异步进程、管道、定时与网络探测；
# 只开用到的 feature，不引入默认的 fs/信号面。
tokio = { version = "1", default-features = false, features = [
    "process",
    "io-util",
    "net",
    "time",
    "sync",
    "macros",
    "rt",
] }
# 就绪行解析出的 URL 需要严格校验（回环/端口），不信任子进程输出。
url = "2"
# 工作区/家目录定位（node-runtime 也依赖它）。
dirs = "6"
# Node 发行版校验（SHASUMS256.txt）与 zip 解包；只开 deflate。
sha2 = "0.10"
zip = { version = "6", default-features = false, features = ["deflate"] }
# 搜索双页（M2，架构 §4.9）：文件名搜索与内容搜索 SDK，均为 MIT。
# fff 定制版已收编进仓库（crates/fff-*），不再依赖外部路径/仓库。
fff-search = { path = "crates/fff-core" }
fff-grep = { path = "crates/fff-grep" }
fff-query-parser = { path = "crates/fff-query-parser", default-features = false }
# 移植 crate：进程树回收 + Node 探测。
proc-guard = { path = "crates/proc-guard" }
node-runtime = { path = "crates/node-runtime" }
tauri-plugin-clipboard-manager = "2.3.3"
xcap = "0.9.8"
tauri-plugin-global-shortcut = "2.3.2"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
portable-pty = "0.9.0"
# 远程网关（R1，架构 §4.5）：DSH 回环唯一暴露面——axum 终结 HTTP/WS，
# reqwest 流式转发 /api（含 SSE），tokio-tungstenite 桥两条 WS 下行。
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = [
    "stream",
    "json",
] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
# 网卡枚举（绑定地址选择 + EasyTier 识别）。
if-addrs = "0.13"
# grep 结果的 glob 过滤（M2 深化）：glob→正则。fff 自用版本不外露。
regex = "1"
# 设备配对 token。
rand = "0.8"
# /qx-mobile/info 的电脑主机名（App 端自动命名连接用）。
hostname = "0.4"
tauri-plugin-dialog = "2.7.3"
# 磁盘清理（磁盘清理页）：删除走回收站，可撤销。
trash = "5"

[target.'cfg(windows)'.dependencies]
# 盘符枚举（搜索根选择器，M2 深化）：与 proc-guard 同一条 windows-sys 主线，
# 只多开 Storage_FileSystem 一个 feature 门。单实例（single_instance 模块）
# 用 Threading 门：互斥体/事件/等待。
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
# 终端域（M4）：开启 WebView2 浏览器加速键（Ctrl+F 等），复制/粘贴
# 由 xterm.attachCustomKeyEventHandler 在终端内自行处理（Ctrl+Shift+C/V）。
webview2-com = "0.38"
windows-core = "0.61"
